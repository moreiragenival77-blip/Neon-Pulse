<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
 <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#00d9e9"/><stop offset=".5" stop-color="#16172d"/><stop offset="1" stop-color="#ec00a9"/></linearGradient>
 <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#00d7ef"/><stop offset=".55" stop-color="#252b5d"/><stop offset="1" stop-color="#a000a8"/></linearGradient>
 <filter id="soft"><feGaussianBlur stdDeviation="2.5"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<!-- dark rounded-square body and subtle colored rim -->
<rect x="8" y="8" width="496" height="496" rx="91" fill="#05070d" stroke="#202535" stroke-width="8"/>
<rect x="12" y="12" width="488" height="488" rx="88" fill="none" stroke="url(#frame)" stroke-width="2" opacity=".75"/>
<!-- tiny corner lights -->
<circle cx="60" cy="60" r="4.5" fill="#00ddeb"/><circle cx="452" cy="60" r="4.5" fill="#ed008f"/>
<circle cx="60" cy="452" r="4.5" fill="#ed008f"/><circle cx="452" cy="452" r="4.5" fill="#00ddeb"/>
<!-- outer dashed orbit -->
<circle cx="256" cy="256" r="187" fill="none" stroke="#172235" stroke-width="3" stroke-dasharray="5 9" opacity=".8"/>
<!-- concentric audio rings -->
<circle cx="256" cy="256" r="157" fill="none" stroke="#202b43" stroke-width="3"/>
<path d="M99 256a157 157 0 0 1 314 0" fill="none" stroke="url(#ring)" stroke-width="3" opacity=".8"/>
<circle cx="256" cy="256" r="126" fill="none" stroke="#222b42" stroke-width="3"/>
<path d="M130 256a126 126 0 0 1 252 0" fill="none" stroke="url(#ring)" stroke-width="2.5"/>
<circle cx="256" cy="256" r="94" fill="none" stroke="#283047" stroke-width="3"/>
<circle cx="256" cy="256" r="81" fill="#080b13" stroke="#20283d" stroke-width="3"/>
<circle cx="256" cy="256" r="78" fill="none" stroke="#a0009e" stroke-width="2" opacity=".7"/>
<!-- equalizer bars -->
<g filter="url(#glow)" stroke-linecap="round" fill="none">
 <path d="M166 239v34" stroke="#00eaff" stroke-width="8"/>
 <path d="M184 220v72" stroke="#00eaff" stroke-width="9"/>
 <path d="M202 202v108" stroke="#00eaff" stroke-width="9"/>
 <path d="M310 202v108" stroke="#f0009c" stroke-width="9"/>
 <path d="M328 220v72" stroke="#f0009c" stroke-width="9"/>
 <path d="M346 239v34" stroke="#f0009c" stroke-width="8"/>
</g>
<!-- central pulse mark -->
<g filter="url(#glow)" fill="none" stroke-linecap="round" stroke-linejoin="round">
 <path d="M230 266l13-35 15 56 12-36 12 18 12-13" stroke="#f7fbff" stroke-width="5"/>
 <circle cx="256" cy="256" r="18" stroke="#00eaff" stroke-width="3" opacity=".9"/>
</g>
</svg>